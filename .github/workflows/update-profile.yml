name: Update Profile

on:
  schedule:
    - cron: '0 7 * * *'  # Daily at 7 AM UTC (1h after mmdb-meta updates)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate profile
        run: node scripts/generate-profile.mjs

      - name: Commit and push
        run: |
          git diff --quiet && exit 0
          git config user.name "mmdb-bot[bot]"
          git config user.email "mmdb-bot[bot]@users.noreply.github.com"
          git add profile/README.md
          git commit -m "chore: update org profile [skip ci]"
          git push
